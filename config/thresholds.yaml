# AML Suspicious Activity Detection System Thresholds & Config

# Typology Rules Configuration
structuring:
  reporting_threshold: 10000.0
  lower_bound_ratio: 0.85      # 8,500 USD
  window_days: 7
  min_transaction_count: 3

smurfing:
  fan_in_threshold: 5          # 5+ distinct senders to single beneficiary
  window_hours: 48
  aggregation_ratio: 0.80      # 80%+ of received funds aggregated/transferred

layering:
  min_hops: 3                  # 3+ chain hops
  fee_attrition_max: 0.05      # 2-5% fee attrition allowance
  window_hours: 72

rapid_cashout:
  inflow_outflow_window_hours: 24
  min_inflow_amount: 5000.0
  outflow_ratio_threshold: 0.90  # 90%+ outflow within 24h

round_tripping:
  max_cycle_length: 5
  window_hours: 96
  amount_tolerance: 0.05

velocity:
  window_days: 30
  z_score_threshold: 3.0

# Composite Risk Scoring Weights
risk_weights:
  rule_weight: 0.40
  ml_weight: 0.35
  graph_weight: 0.25

# Risk Categorization Thresholds
risk_thresholds:
  low_cutoff: 0.35            # < 0.35 -> Low (Monitor)
  high_cutoff: 0.70           # > 0.70 -> High (Report), 0.35-0.70 -> Med (Review)

# Anomaly Detection ML Hyperparameters
ml_config:
  isolation_forest:
    n_estimators: 100
    contamination: 0.05
    random_state: 42
  lof:
    n_neighbors: 20
    contamination: 0.05

# General Application Configuration
app:
  dataset_path: "data/HI-Small_Trans.csv"
  default_llm_model: "llama-3.3-70b-versatile"
